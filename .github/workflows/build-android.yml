name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android export dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Install Godot 4.7.2 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import Godot resources
        run: godot --headless --editor --path . --quit

      - name: Set SDK paths in Godot editor settings
        run: python3 scripts/configure_android.py

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/amoeba-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/amoeba-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Smoke-test gameplay mechanics
        run: godot --headless --path . --script res://tests/arena_smoke.gd

      - name: Export debug APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android" builds/amoeba-arena.apk
          test -s builds/amoeba-arena.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: amoeba-arena-android-apk
          path: builds/amoeba-arena.apk
          if-no-files-found: error
