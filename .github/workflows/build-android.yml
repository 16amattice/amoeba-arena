name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          test -d "$SDK/cmdline-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android export dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.7.2 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import Godot resources
        run: godot --headless --editor --path . --quit

      - name: Set SDK paths in Godot editor settings
        run: python3 scripts/configure_android.py

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/amoeba-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/amoeba-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Smoke-test gameplay mechanics
        run: godot --headless --path . --script res://tests/arena_smoke.gd

      - name: Export debug APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-debug "Android" builds/amoeba-arena.apk
          test -s builds/amoeba-arena.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: amoeba-arena-android-apk
          path: builds/amoeba-arena.apk
          if-no-files-found: error
